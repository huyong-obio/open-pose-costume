server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;

  # 健康检查（install.sh / compose healthcheck 共用）
  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  # 代理路由探测：确认镜像里已包含火山代理（GET 应返回 200，而不是 404）
  location = /opc-proxy/ark/healthz {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":true,"proxy":"volcengine-ark"}\n';
  }

  # 同源火山方舟 Seedream 代理（必须写在 location / 之前）
  # 浏览器 → /opc-proxy/ark/api/v3/images/generations
  # 上游   → https://ark.cn-beijing.volces.com/api/v3/images/generations
  location /opc-proxy/ark/ {
    limit_except POST OPTIONS {
      deny all;
    }

    # 127.0.0.11 = Docker 内置 DNS；再兜底公共 DNS
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;

    rewrite ^/opc-proxy/ark/(.*)$ /$1 break;
    # 变量形式的 proxy_pass 才会走上面的 resolver
    set $ark_upstream https://ark.cn-beijing.volces.com;
    proxy_pass $ark_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name ark.cn-beijing.volces.com;
    proxy_set_header Host ark.cn-beijing.volces.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_connect_timeout 30s;
  }

  # 同源 Atomflow 图片编辑代理
  location = /opc-proxy/site/v1/images/edits {
    limit_except POST OPTIONS {
      deny all;
    }
    proxy_pass https://atomflow.vip/v1/images/edits;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host atomflow.vip;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }

  location = /opc-proxy/api/v1/images/edits {
    limit_except POST OPTIONS {
      deny all;
    }
    proxy_pass https://api.atomflow.vip/v1/images/edits;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host api.atomflow.vip;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA：已存在的静态资源直接返回；其余回退 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
